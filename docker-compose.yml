version: '3.8'

services:
  backend:
    build: .
    container_name: electricity_theft_backend
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m src.train && uvicorn src.api:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: .
    container_name: electricity_theft_frontend
    ports:
      - "8501:8501"
    environment:
      - THEFT_API_URL=http://backend:8000
    command: >
      sh -c "streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
