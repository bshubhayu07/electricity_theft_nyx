name: Smart Grid Threat Engine CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_validate:
    name: Train Model & Validate Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Pipeline Training
        run: |
          python -m src.train

      - name: Validate FastAPI Backend Health
        run: |
          python -c "import src.api; print('FastAPI API Application module loaded successfully.')"
